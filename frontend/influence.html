<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影响力排名 · 社交网络图分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main">
      <header id="topbar"></header>
      <section id="content">
        <div class="page-head">
          <div>
            <h1>影响力排名</h1>
            <p class="desc">度数中心性、PageRank、介数中心性各自独立计算并归一化到 [0,1]，再按权重加权融合为综合影响力得分。拖动权重滑块即刻重新排名。</p>
          </div>
          <div class="actions">
            <button class="btn" id="btnEqual">均等权重</button>
            <button class="btn btn-primary" id="btnSave">保存为默认权重</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title">权重配置 <span class="sub">自动归一化，总和恒为 100%</span></div>
            <div class="row">
              <span class="badge info" id="weightSum">权重和 100%</span>
              <select class="select" id="topK" style="width:120px">
                <option value="20">Top 20</option>
                <option value="50" selected>Top 50</option>
                <option value="100">Top 100</option>
                <option value="500">全部</option>
              </select>
            </div>
          </div>
          <div class="card-body">
            <div class="weight-row">
              <span class="w-label">度数中心性</span>
              <input type="range" id="rDegree" min="0" max="100" step="1">
              <input class="input w-num" id="nDegree" type="number" min="0" max="100" step="1">
              <span class="w-pct" id="pDegree">—</span>
            </div>
            <div class="weight-row">
              <span class="w-label">PageRank</span>
              <input type="range" id="rPagerank" min="0" max="100" step="1">
              <input class="input w-num" id="nPagerank" type="number" min="0" max="100" step="1">
              <span class="w-pct" id="pPagerank">—</span>
            </div>
            <div class="weight-row">
              <span class="w-label">介数中心性</span>
              <input type="range" id="rBetweenness" min="0" max="100" step="1">
              <input class="input w-num" id="nBetweenness" type="number" min="0" max="100" step="1">
              <span class="w-pct" id="pBetweenness">—</span>
            </div>
            <div class="row wrap mt-8">
              <span class="faint small" id="metaInfo">三类中心性独立计算后缓存，调权重只重跑加权融合。</span>
            </div>
          </div>
        </div>

        <div class="card mt-16">
          <div class="card-head">
            <div class="card-title">综合影响力排名 <span class="sub">分项为归一化得分（百分制），悬停查看原始值</span></div>
            <span class="badge brand" id="totalBadge"></span>
          </div>
          <div class="card-body" id="ranking"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    const C = common;
    const KEYS = ["Degree", "Pagerank", "Betweenness"];   // UI 后缀
    const API_KEYS = { Degree: "degree", Pagerank: "pagerank", Betweenness: "betweenness" };
    let debounceTimer = null;

    // ------------------------------------------------------------------
    // 权重控件
    // ------------------------------------------------------------------
    function getWeights() {
      const w = {};
      for (const k of KEYS) w[API_KEYS[k]] = parseFloat(document.getElementById("n" + k).value) || 0;
      return w;
    }

    function setWeights(w) {
      for (const k of KEYS) {
        const v = Math.round((w[API_KEYS[k]] || 0) * 100);
        document.getElementById("r" + k).value = v;
        document.getElementById("n" + k).value = v;
      }
      updatePct();
    }

    function updatePct() {
      const w = getWeights();
      const sum = w.degree + w.pagerank + w.betweenness;
      for (const k of KEYS) {
        const raw = w[API_KEYS[k]];
        const pct = sum > 0 ? (raw / sum * 100) : (100 / 3);
        document.getElementById("p" + k).textContent = pct.toFixed(1) + "%";
      }
      const badge = document.getElementById("weightSum");
      badge.textContent = "权重和 " + (sum > 0 ? "100%" : "均等");
      badge.className = "badge " + (sum > 0 ? "info" : "warning");
    }

    function syncFrom(id) {
      // range 与 number 双向同步
      const k = id.slice(1);
      const src = document.getElementById(id);
      const dst = document.getElementById((id[0] === "r" ? "n" : "r") + k);
      let v = parseFloat(src.value) || 0;
      v = Math.max(0, Math.min(100, v));
      src.value = v;
      dst.value = v;
      scheduleCompute();
    }

    function scheduleCompute() {
      updatePct();
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => compute(false), 300);
    }

    // ------------------------------------------------------------------
    // 计算与渲染
    // ------------------------------------------------------------------
    function compute(saveWeights) {
      const top = parseInt(document.getElementById("topK").value, 10) || 50;
      return api.computeInfluence({ weights: getWeights(), top, saveWeights: !!saveWeights })
        .then((d) => {
          render(d);
          if (saveWeights) C.toast("已保存为默认权重，排名已更新", "success");
        })
        .catch((e) => C.toast(e.message, "error"));
    }

    function fmtPctCell(norm, raw) {
      return '<td class="num" title="原始值 ' + raw + '">' + (norm * 100).toFixed(1) + "</td>";
    }

    function render(d) {
      const items = d.items || [];
      document.getElementById("totalBadge").textContent = "共 " + (d.total || 0) + " 节点";
      const parts = [];
      if (d.centrality_ms) parts.push("中心性计算 " + C.fmtMs(d.centrality_ms));
      parts.push("加权融合 " + C.fmtMs(d.blend_ms || 0));
      document.getElementById("metaInfo").textContent =
        parts.join(" · ") + " · 三类中心性独立计算后缓存，调权重只重跑加权融合";

      if (!items.length) {
        document.getElementById("ranking").innerHTML = C.emptyState("★", "暂无数据，请先导入关系或生成演示数据");
        return;
      }
      let html = '<div class="table-wrap"><table class="table"><thead><tr>' +
        "<th>排名</th><th>用户</th>" +
        '<th style="text-align:right">度数中心性</th>' +
        '<th style="text-align:right">PageRank</th>' +
        '<th style="text-align:right">介数中心性</th>' +
        "<th>综合得分</th></tr></thead><tbody>";
      for (const it of items) {
        const pct = it.score * 100;
        html += "<tr>" +
          '<td><span class="rank-badge' + (it.rank <= 3 ? " top" : "") + '">' + it.rank + "</span></td>" +
          "<td>" + C.escapeHtml(it.name) + ' <span class="faint small">#' + it.id + "</span></td>" +
          fmtPctCell(it.degree_norm, it.degree_centrality) +
          fmtPctCell(it.pagerank_norm, it.pagerank) +
          fmtPctCell(it.betweenness_norm, it.betweenness) +
          '<td><div class="score-cell"><span class="mini-track"><span class="mini-fill" style="width:' +
            pct.toFixed(1) + '%"></span></span><span class="score-num">' + pct.toFixed(1) + "</span></div></td>" +
          "</tr>";
      }
      html += "</tbody></table></div>";
      document.getElementById("ranking").innerHTML = html;
    }

    // ------------------------------------------------------------------
    // 初始化：读已保存权重 -> 立即按该权重计算
    // ------------------------------------------------------------------
    C.initPage("influence", function () {
      for (const k of KEYS) {
        document.getElementById("r" + k).addEventListener("input", (e) => syncFrom(e.target.id));
        document.getElementById("n" + k).addEventListener("input", (e) => syncFrom(e.target.id));
      }
      document.getElementById("topK").addEventListener("change", () => compute(false));
      document.getElementById("btnEqual").addEventListener("click", () => {
        setWeights({ degree: 1 / 3, pagerank: 1 / 3, betweenness: 1 / 3 });
        scheduleCompute();
      });
      document.getElementById("btnSave").addEventListener("click", () => compute(true));

      document.getElementById("ranking").innerHTML = C.spinner();
      api.settings().then((s) => {
        const inf = (s && s.influence) || {};
        setWeights({
          degree: inf.degreeWeight != null ? inf.degreeWeight : 1 / 3,
          pagerank: inf.pagerankWeight != null ? inf.pagerankWeight : 1 / 3,
          betweenness: inf.betweennessWeight != null ? inf.betweennessWeight : 1 / 3,
        });
        compute(false);
      }).catch((e) => {
        setWeights({ degree: 1 / 3, pagerank: 1 / 3, betweenness: 1 / 3 });
        compute(false);
        C.toast(e.message, "error");
      });
    });
  </script>
</body>
</html>
